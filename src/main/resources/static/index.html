<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Device IMEI Data</title>

  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
</head>
<body>

<main>
  <h1>Device IMEI Data</h1>

  <div class="toolbar">
    <button id="connectButton">Connect to Server</button>
    <button id="getDevicesButton" hidden disabled>Get All Devices</button>
  </div>

  <div id="instanceInfo" class="instance-info" role="status" aria-live="polite">
    Java instance: Not connected
  </div>

  <div id="deviceSelection" class="selection-panel" hidden>
    <label for="deviceImeiSelect">Device IMEI</label>
    <select id="deviceImeiSelect" multiple size="10"></select>
    <button id="subscribeDevicesButton" disabled>
      Subscribe Selected Devices
    </button>
  </div>

<pre id="output" class="output-panel">
Not connected
</pre>

<pre id="selectedOutput" class="selected-panel" hidden>
</pre>

<pre id="subscriptionOutput" class="subscription-panel" hidden>
</pre>

<pre id="liveDataOutput" class="live-panel" hidden>
</pre>
</main>

<script src="app.js"></script>

</body>
</html>
