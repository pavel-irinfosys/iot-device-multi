services:
  haproxy:
    image: haproxy:3.0-alpine
    container_name: multi-local-haproxy
    network_mode: host
    volumes:
      - ./ops/haproxy/local-multi-instance.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: multi-local-redis
    ports:
      - "26379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped