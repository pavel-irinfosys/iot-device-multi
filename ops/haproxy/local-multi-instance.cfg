global
  log stdout format raw local0
  maxconn 4096

defaults
  mode http
  log global
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client 1m
  timeout server 1m
  timeout tunnel 1h

frontend local_http
  bind *:8080
  default_backend spring_boot_instances

backend spring_boot_instances
  balance roundrobin
  cookie APP_INSTANCE insert indirect nocache httponly
  option httpchk GET /api/instance
  http-check expect status 200
  server app1 127.0.0.1:8081 check cookie app1
  server app2 127.0.0.1:8082 check cookie app2
  server app3 127.0.0.1:8083 check cookie app3
